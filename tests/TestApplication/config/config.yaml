imports:
    - { resource: "@SyliusMcpServerPlugin/config/config.yaml" }
    - { resource: "@TmonierSyliusTradeCreditPlugin/config/config.yaml" }
    - { resource: "@TmonierSyliusQuickOrderPlugin/config/config.yaml" }
    - { resource: "@TmonierSyliusQuoteRequestPlugin/config/config.yaml" }
    - { resource: "@TmonierSyliusCompanyAccountsPlugin/config/config.yaml" }
    - { resource: "@TmonierSyliusB2bMcpPlugin/config/config.yaml" }
    - { resource: "dbal_savepoints.php" }

tmonier_sylius_b2b_mcp:
    rate_limit:
        cache_pool: cache.tmonier_b2b_mcp_limiter
    oauth:
        # A fixed key: the kernel secret of the test application is empty.
        encryption_key: 'test-application-encryption-key-not-for-production'

tmonier_sylius_quote_request:
    pdf_attachment_directory: '%kernel.cache_dir%/tmonier_quote_request_pdf'
    rate_limit:
        cache_pool: cache.tmonier_b2b_mcp_limiter

framework:
    cache:
        pools:
            # Filesystem (an array pool is reset between requests); cleared by every functional test.
            cache.tmonier_b2b_mcp_limiter:
                adapter: cache.adapter.filesystem

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Demo data (dev and test databases): b2b@example.com with a trade credit account and open
# items, the Acme Industries company (members and orders), quote requests, quick order catalog.
sylius_fixtures:
    suites:
        default:
            fixtures:
                # Before the trade credit fixture: its orders must not pick "On account".
                tmonier_company_accounts:
                    priority: -90
                    options:
                        orders_per_member: 2
                tmonier_trade_credit:
                    priority: -100
                tmonier_quote_request:
                    priority: -120
                    options:
                        amount: 4
